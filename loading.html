<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinz Space | Loading</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0514;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .loading-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #260f42 0%, #0d0514 100%);
        }

        .spinner {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .core {
            width: 44px;
            height: 44px;
            background: #9d4edd;
            border-radius: 50%;
            box-shadow: 0 0 20px #9d4edd, 0 0 40px #7b2cbf;
            animation: pulse 1.5s ease-in-out infinite alternate;
            z-index: 10;
        }

        .orbit-container {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: spin 4s linear infinite;
        }

        .orbit-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top-color: #c77dff;
            border-right-color: #9d4edd;
            border-radius: 50%;
            animation: spin 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .orbit-ring:nth-child(2) {
            width: 75%;
            height: 75%;
            top: 12.5%;
            left: 12.5%;
            border-width: 2px;
            border-top-color: #e0aaff;
            border-right-color: transparent;
            border-left-color: #7b2cbf;
            border-bottom-color: #5a189a;
            animation-direction: reverse;
            animation-duration: 3s;
        }

        .orbit-ring:nth-child(3) {
            width: 50%;
            height: 50%;
            top: 25%;
            left: 25%;
            border-width: 2px;
            border-top-color: transparent;
            border-right-color: #c77dff;
            border-bottom-color: #9d4edd;
            border-left-color: transparent;
            animation-duration: 1.5s;
        }

        .loading-text {
            margin-top: 40px;
            color: #e0aaff;
            font-size: 1.1rem;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            font-weight: 600;
            background: linear-gradient(90deg, #5a189a, #e0aaff, #5a189a);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 2s linear infinite;
            padding-left: 0.6em;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.85);
                opacity: 0.8;
                box-shadow: 0 0 15px #7b2cbf;
            }
            100% {
                transform: scale(1.15);
                opacity: 1;
                box-shadow: 0 0 35px #9d4edd, 0 0 60px #c77dff;
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        @media (max-width: 768px) {
            .spinner { width: 110px; height: 110px; }
            .core { width: 36px; height: 36px; }
            .loading-text {
                font-size: 0.95rem;
                letter-spacing: 0.4em;
                margin-top: 36px;
                padding-left: 0.4em;
            }
        }

        @media (max-width: 480px) {
            .spinner { width: 90px; height: 90px; }
            .core { width: 28px; height: 28px; }
            .loading-text {
                font-size: 0.85rem;
                letter-spacing: 0.3em;
                margin-top: 32px;
                padding-left: 0.3em;
            }
        }
    </style>
</head>
<body>
    <div class="loading-wrapper">
        <div class="spinner">
            <div class="orbit-container">
                <div class="orbit-ring"></div>
                <div class="orbit-ring"></div>
                <div class="orbit-ring"></div>
            </div>
            <div class="core"></div>
        </div>
        <div class="loading-text">Loading...</div>
    </div>
    <script>
        // Redirect ke index.html setelah 2.2 detik
        setTimeout(function () {
            window.location.replace('index.html');
        }, 2200);
    </script>
</body>
</html>
